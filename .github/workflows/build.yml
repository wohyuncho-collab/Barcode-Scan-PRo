name: Build LabelScan PRO APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: 'temurin', java-version: '21' }
      - run: npm install -g @capacitor/cli
      - run: |
          npm init -y
          npm install @capacitor/core @capacitor/android
          npx cap init "LabelScan PRO" com.labelscan.pro --web-dir=www
          npx cap add android
      - run: |
          mkdir -p www && cp index.html www/index.html
          npx cap copy android || true
      - name: Copy icons (force)
        run: |
          ls -R icons
          if [ -f "icons/icon-512.png" ]; then
            for dir in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p android/app/src/main/res/mipmap-$dir
              cp -f icons/icon-512.png android/app/src/main/res/mipmap-$dir/ic_launcher.png
              cp -f icons/icon-512.png android/app/src/main/res/mipmap-$dir/ic_launcher_round.png
            done
            rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          else
            echo "icons/icon-512.png not found!"; exit 1
          fi
      - name: Add Camera permission
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "CAMERA" "$MANIFEST"; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST"
          fi
      - run: |
          cd android && chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LabelScan-PRO-APK
          path: android/app/build/outputs/apk/debug/LabelScan-PRO.apk
