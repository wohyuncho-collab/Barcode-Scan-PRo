name: Build BarcodeScan APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor
        run: npm install -g @capacitor/cli

      - name: Init Android Project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android
          npx cap init BarcodeScan --web-dir=www --package-id=com.barcodescan.pro
          npx cap add android

      - name: Copy web assets
        run: |
          mkdir -p www
          mkdir -p android/app/src/main/assets/public
          cp index.html www/index.html
          cp index.html android/app/src/main/assets/public/index.html
          npx cap copy android || true
          npx cap sync android || true

      - name: Copy icons (if exists)
        run: |
          if [ -f "icons/icon-512.png" ]; then
            echo "Copying icons..."
            for dir in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p android/app/src/main/res/mipmap-$dir
              cp icons/icon-192.png android/app/src/main/res/mipmap-$dir/ic_launcher.png 2>/dev/null || cp icons/icon-512.png android/app/src/main/res/mipmap-$dir/ic_launcher.png
              cp icons/icon-192.png android/app/src/main/res/mipmap-$dir/ic_launcher_round.png 2>/dev/null || cp icons/icon-512.png android/app/src/main/res/mipmap-$dir/ic_launcher_round.png
            done
            mkdir -p android/app/src/main/res/mipmap-xxxhdpi
            cp icons/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp icons/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
            echo "Icons copied"
          else
            echo "No icons folder found, using default icon"
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BarcodeScan-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
